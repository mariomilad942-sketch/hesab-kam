<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF5B2E">
<title>الحساب كام</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="اطلبوا سوا، وكل واحد يعرف عليه كام في ثانية.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}/* Layout: one phone-width column of receipt-paper cards; on desktop the host screens open into a two-column dashboard. Single deliberate warm-paper look. */
:root{
  --text:#17120E; --ink:#17120E; --ink2:#2A231D; --paper:#FFF7EA; --card:#FFFFFF; --sand:#F6EFE3; --sand2:#F1E8DA;
  --orange:#FF5B2E; --orange-soft:#FFE4D9; --mint:#12B886; --mint-ink:#0B7A59; --mint-soft:#DCF5EC;
  --yellow:#FFD43B; --muted:#7A6F64; --faint:#B3A99D; --line:#EDE3D3; --red:#E5484D; --red-soft:#FDE7E7; --on-ink:#CFC5B8;
  --display:'Lalezar','Readex Pro',system-ui,sans-serif;
  --body:'Readex Pro','Segoe UI',Tahoma,system-ui,sans-serif;
  --r-sm:12px; --r:18px; --r-lg:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}
.app{max-width:480px;margin-inline:auto;padding-block:12px 140px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.app.wide{max-width:1180px}
h1,h2,h3,.big{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:0}
h1{font-size:clamp(32px,8vw,44px)} h2{font-size:30px} h3{font-size:22px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:12px}
.row>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.topbar{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:24px}
.mark{width:28px;height:31px;flex:none;overflow:visible}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--r);padding:16px 20px;font-weight:600;font-size:17px;min-height:56px;width:100%;transition:transform .12s ease,filter .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.primary{background:var(--orange);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.white{background:var(--card);border:1.2px solid var(--line)}
.btn.ghost{border:1.2px solid var(--line)}
.btn.soft{background:var(--orange-soft);color:var(--orange)}
.btn.red{background:var(--red);color:#fff}
.btn.red-soft{background:var(--red-soft);color:var(--red)}
.btn.sm{min-height:0;padding:9px 14px;font-size:14px;border-radius:999px;width:auto}
.btn.xs{min-height:0;padding:7px 12px;font-size:13px;border-radius:12px;width:auto}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--text);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;flex:none}
.icon-btn.sm{width:32px;height:32px;font-size:14px;border:0;background:var(--sand)}
.icon-btn.del{background:var(--red-soft);color:var(--red)}
.dashed{border:1.5px dashed var(--orange);color:var(--orange);background:transparent;border-radius:16px;padding:12px;font-weight:600;width:100%}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card.lg{border-radius:var(--r-lg);padding:20px}
.card.hl{border:1.5px solid var(--orange)}
.ink{background:var(--ink);color:#fff;border-color:var(--ink)}
.ink .muted{color:var(--on-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--sand)}
.pill.orange{background:var(--orange-soft);color:var(--orange)} .pill.mint{background:var(--mint-soft);color:var(--mint-ink)}
.pill.yellow{background:var(--yellow);color:var(--text)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.white{background:#fff;color:var(--text)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;flex:none;line-height:1;padding-top:3px}
.avatar.lg{width:64px;height:64px;font-size:32px}
.receipt{background:var(--card);border-radius:22px 22px 0 0;padding:22px 20px 18px;position:relative;margin-bottom:12px}
.receipt::after{content:"";position:absolute;inset-inline:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--card) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--card) 0) 0 0/14px 10px repeat-x}
.receipt.paper{background:var(--paper)} .receipt.paper::after{background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x}
.rule{border:0;border-top:1.5px dashed var(--line);margin:4px 0}
.line{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.line .v{white-space:nowrap}

/* forms */
label.f{display:flex;flex-direction:column;gap:8px}
label.f>span{font-size:14px;font-weight:500;color:var(--muted)}
.input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;outline:none;min-width:0}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.input::placeholder{color:var(--faint)}
textarea.input{resize:vertical;min-height:84px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:10px 18px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.seg{display:flex;flex-direction:row-reverse;background:var(--sand2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:12px;padding:9px 10px;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(23,18,14,.06)}
.stepper{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--sand);font-size:18px;font-weight:600;display:grid;place-items:center}
.stepper button.plus{background:var(--orange);color:#fff}
.stepper output{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper.big{gap:28px;padding:6px}.stepper.big button{width:46px;height:46px;font-size:22px}.stepper.big output{font-family:var(--display);font-size:32px;min-width:36px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.item .top{display:flex;gap:8px;align-items:center}
.item .top input{flex:1;background:var(--sand);border:0;border-radius:12px;padding:11px 12px;font-size:16px;font-weight:500;min-width:0;outline:none}
.item .top input:focus{background:#fff;box-shadow:0 0 0 1.5px var(--ink)}
.price{display:flex;align-items:center;gap:6px;background:var(--sand);border-radius:12px;padding:6px 12px}
.price input{width:76px;border:0;background:transparent;font-weight:600;font-size:17px;outline:none;text-align:left;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:14px}

/* bottom bar + sheets */
.bottom{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 78%,transparent);z-index:5}
.bottom .in{max-width:480px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.cart{display:flex;flex-direction:row-reverse;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;border-radius:22px;padding:10px 10px 10px 18px}
.cart .btn{width:auto;min-height:0;padding:14px 18px;border-radius:16px}
.overlay{position:fixed;inset:0;background:rgba(23,18,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto;animation:up .22s ease}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:448px;margin-inline:auto;background:var(--mint-soft);color:var(--mint-ink);border-radius:16px;padding:12px 16px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(23,18,14,.12);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px)}}

/* home hero */
.hero{position:relative;height:210px;border-radius:28px;background:var(--orange);overflow:hidden}
.hero .tk{position:absolute;white-space:nowrap;border-radius:18px;padding:12px 16px;display:flex;flex-direction:column}
.hero .tk b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1}
.hero .cap{position:absolute;bottom:14px;inset-inline-start:18px;color:#fff;font-size:13px;font-weight:500}
.choice{display:flex;flex-direction:column;gap:8px;text-align:start;border-radius:26px;padding:20px;background:var(--card);border:1px solid var(--line);width:100%}
.choice[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.choice[aria-pressed="true"] .muted{color:var(--on-ink)}
.timer{font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;display:flex;justify-content:flex-start}
.progress i{display:block;height:100%;background:var(--mint);border-radius:5px;transition:width .4s ease}
.dots{display:flex;gap:4px}.dots i{height:6px;width:12px;border-radius:3px;background:var(--line)}.dots i.done{background:var(--mint)}.dots i.cur{width:26px;background:var(--orange)}
.empty{border:1.5px dashed var(--line);border-radius:28px;padding:32px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--card)}
.emoji{font-size:52px;line-height:1}
.qr{width:168px;height:168px;background:#fff;border-radius:14px;padding:8px;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.code{font-family:var(--display);font-size:40px;line-height:1;letter-spacing:.02em}
.big-amount{font-family:var(--display);font-size:clamp(72px,24vw,104px);line-height:1}
.screen-yellow{--paper:#FFD43B}
.screen-mint{--paper:#12B886;color:#fff}
.screen-ink{--paper:#17120E;color:#fff}
.screen-orange{--paper:#FF5B2E;color:#fff}
.screen-ink .muted,.screen-orange .muted,.screen-mint .muted{color:rgba(255,255,255,.78)}
.screen-ink :is(.receipt,.card:not(.ink),.choice:not([aria-pressed="true"])) .muted,.screen-orange :is(.receipt,.card:not(.ink)) .muted,.screen-mint :is(.receipt,.card:not(.ink)) .muted,.screen-yellow :is(.receipt,.card:not(.ink)) .muted{color:var(--muted)}
.receipt,.card:not(.ink){color:var(--text)}
.mode-note{font-size:12px;color:var(--muted);text-align:center}

/* desktop dashboard */
@media (min-width:960px){
  .dash{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
  .dash.two{grid-template-columns:minmax(0,1fr) 400px}
  .dash.two>.hero-col{order:2}
  .dash .side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
  .grid-orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .app.wide .bottom .in{max-width:1180px;flex-direction:row;justify-content:flex-end}
  .app.wide .bottom .btn{width:auto;min-width:240px}
}
@media (max-width:959px){.dash{display:flex;flex-direction:column;gap:16px}.grid-orders{display:flex;flex-direction:column;gap:12px}.only-wide{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* bottom actions: sticker-style so they stand apart from the cards behind them */
.bottom .btn{border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink),0 14px 24px -10px rgba(23,18,14,.35)}
.bottom .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bottom .cart .btn{border:0;box-shadow:none}
.screen-ink .bottom .btn{border-color:transparent;box-shadow:0 5px 0 rgba(255,255,255,.16),0 14px 24px -10px rgba(0,0,0,.5)}
.bottom{padding-top:22px}
.bottom .in{gap:16px}

/* item editor: labelled fields so people know where the price goes */
.item .cap{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px;text-align:right}
.item .row{align-items:flex-end}
.item .fld{display:flex;flex-direction:column}
.item .price{background:#fff;border:1.5px solid var(--orange);min-height:48px}
.item .price input{width:128px;font-size:18px}
.item .price input:placeholder-shown{text-align:right}
.item .price input::placeholder{color:var(--orange);opacity:.75;font-weight:500;font-size:14px}
.item>.cap{margin-bottom:-6px}

/* ===== Dark theme: same brand (orange / yellow / mint), warm near-black paper instead of cream ===== */
:root[data-theme="dark"]{
  color-scheme:dark;
  --text:#FBF1E3; --ink:#2E251E; --ink2:#3A2F26;
  --paper:#15110E; --card:#211B16; --sand:#2B231D; --sand2:#1B1612;
  --orange-soft:#3B1F14; --mint-soft:#103429; --mint-ink:#5FD6AE;
  --muted:#AB9E90; --faint:#6F645A; --line:#3A3129; --red:#FF6B6F; --red-soft:#3A1A1B; --on-ink:#C7BAAC;
}
:root[data-theme="dark"] .btn.dark{background:var(--text);color:#17120E}
:root[data-theme="dark"] .ink{border-color:#45392F}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
:root[data-theme="dark"] .choice[aria-pressed="true"]{background:var(--ink);border:2px solid var(--orange);color:var(--text)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#3A3027;color:var(--text);box-shadow:none}
:root[data-theme="dark"] .input:focus{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
:root[data-theme="dark"] .item .top input:focus{background:var(--card);box-shadow:0 0 0 1.5px var(--text)}
:root[data-theme="dark"] .item .price{background:var(--card)}
:root[data-theme="dark"] .pill.yellow,:root[data-theme="dark"] .pill.white{color:#17120E}
:root[data-theme="dark"] .hero .tk{color:#17120E}
:root[data-theme="dark"] .hero .tk[style*="background:#fff"]{background:#FFF7EA!important}
:root[data-theme="dark"] [style*="background:#fff"]:not(.tk){background:var(--sand)!important}
:root[data-theme="dark"] [style*="--card:#FFF7EA"]{--card:#2A221B!important}
:root[data-theme="dark"] [style*="border:3px solid #fff"]{border-color:var(--paper)!important}
:root[data-theme="dark"] .bottom .btn{border-color:#0B0907;box-shadow:0 5px 0 #0B0907,0 14px 24px -10px rgba(0,0,0,.6)}
:root[data-theme="dark"] .bottom .btn:active{box-shadow:0 2px 0 #0B0907}
:root[data-theme="dark"] .screen-ink{--paper:#0E0B09}
:root[data-theme="dark"] .screen-yellow{color:#17120E}
:root[data-theme="dark"] .screen-yellow .muted{color:rgba(23,18,14,.72)}
:root[data-theme="dark"] .screen-yellow :is(.receipt,.card:not(.ink)) .muted{color:var(--muted)}
:root[data-theme="dark"] .screen-yellow :is(.choice,.btn.white,.btn.ghost,.chip,.input,.seg){color:var(--text)}
:root[data-theme="dark"] .screen-yellow :is(.choice,.btn.white) .muted{color:var(--muted)}
:root[data-theme="dark"] .screen-yellow .topbar .icon-btn{background:#17120E;color:#FFD43B;border-color:#17120E}


/* ===== Pull rope: hangs from the top on every screen, grab the ball and pull ===== */
.rope{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none;overflow:visible}
.rope path{fill:none;stroke:var(--rope);stroke-width:1.6;stroke-linecap:round}
.rope circle{fill:var(--ball);filter:drop-shadow(0 0 6px var(--ball-glow))}
:root{--rope:rgba(23,18,14,.55);--ball:#17120E;--ball-glow:rgba(23,18,14,.25)}
:root[data-theme="dark"]{--rope:rgba(255,247,234,.55);--ball:#FFF7EA;--ball-glow:rgba(255,247,234,.55)}
.screen-orange,.screen-mint{--rope:rgba(255,255,255,.7);--ball:#fff;--ball-glow:rgba(255,255,255,.5)}
.rope-grab{position:fixed;z-index:41;width:48px;height:48px;margin:-24px 0 0 -24px;left:0;top:0;border:0;padding:0;border-radius:50%;
  background:transparent;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
.rope-grab:active{cursor:grabbing}
.rope-grab:focus-visible{outline:2.5px solid var(--orange);outline-offset:-10px}

/* the sky between themes: a tint and a soft blur over the page, the moon sets and the sun rises (or the other way) */
.sky{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.sky .blur{position:absolute;inset:0;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0}
.sky .tint{position:absolute;inset:0;opacity:0}
.sky .dusk{background:linear-gradient(160deg,rgba(28,22,48,.78),rgba(70,52,84,.62) 60%,rgba(120,80,90,.5))}
.sky .dawn{background:linear-gradient(160deg,rgba(236,228,250,.72),rgba(250,226,214,.66) 60%,rgba(255,214,190,.6))}
.sky .orb{position:absolute;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%}
.sky .sun{background:radial-gradient(circle at 38% 35%,#FFE7A3,#FFC24A 55%,#FF9F2E);box-shadow:0 0 60px 18px rgba(255,190,70,.45)}
.sky .moon{background:transparent;box-shadow:-24px 12px 0 1px #FFF7EA;filter:drop-shadow(0 0 18px rgba(255,247,234,.6))}
@media (prefers-reduced-motion:reduce){.sky{display:none}}
.screen-ink{--rope:rgba(255,247,234,.55);--ball:#FFF7EA;--ball-glow:rgba(255,247,234,.55)}
.screen-yellow{--rope:rgba(23,18,14,.6);--ball:#17120E;--ball-glow:rgba(23,18,14,.2)}

/* ===== Impostor game ===== */
.avatar.sm{width:28px;height:28px;font-size:15px}
.g-invite{position:fixed;z-index:45;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;max-width:448px;margin-inline:auto;background:#17120E;color:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 14px 34px rgba(0,0,0,.35);border:1.5px solid #FF5B2E;animation:gdrop .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes gdrop{from{transform:translateY(-30px);opacity:0}}
.g-entry{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:#17120E;color:#fff;border-radius:22px;padding:14px 16px;border:1.5px solid #3A3027}
:root[data-theme="dark"] .g-entry{background:#2E251E;border-color:#45392F}
.g-ico{width:42px;height:42px;border-radius:14px;background:#FF5B2E;color:#fff;display:grid;place-items:center;flex:none}
.g-secret{width:100%;min-height:260px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:22px;user-select:none;-webkit-user-select:none}
.g-secret.hidden{background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.22);color:#fff}
.g-secret.food{background:#FF5B2E;color:#fff;box-shadow:0 8px 0 #000;transform:rotate(-1.5deg)}
.g-secret.imp{background:#FFF7EA;color:#17120E;box-shadow:0 8px 0 #000;transform:rotate(1.5deg)}
.g-word{font-family:var(--display);font-size:54px;line-height:1.1}

<script>/* ===== الحساب كام — core: formatting, ids, bill math ===== */
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const nf = new Intl.NumberFormat('ar-EG', { maximumFractionDigits: 2 });

function toAr(v) { return String(v).replace(/\d/g, d => AR_DIGITS[d]); }
function money(v) { return nf.format(Math.round((Number(v) || 0) * 100) / 100); }
function egp(v) { return money(v) + ' ج'; }
/** Parse a number typed with Arabic or Latin digits ("١٢٫٥", "12.5", "١٬٢٠٠"). */
function num(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  const s = String(v ?? '')
    .replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d))
    .replace(/[٫,]/g, '.')
    .replace(/[٬\s]/g, '')
    .replace(/[^\d.\-]/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function uid(n = 10) {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = ''; const r = crypto.getRandomValues(new Uint8Array(n));
  for (const x of r) s += a[x % a.length];
  return s;
}
function newCode() { return String(1000 + (crypto.getRandomValues(new Uint16Array(1))[0] % 9000)); }
function codeLabel(code) { return 'كام-' + toAr(code); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const ORDINALS = ['الأول', 'التاني', 'التالت', 'الرابع', 'الخامس', 'السادس', 'السابع', 'التامن', 'التاسع', 'العاشر'];
function ordinal(i) { return ORDINALS[i] || ('رقم ' + toAr(i + 1)); }

function itemsTotal(items) { return (items || []).reduce((a, it) => a + num(it.p) * Math.max(0, Math.round(num(it.q))), 0); }
function cleanItems(items) { return (items || []).filter(it => String(it.n || '').trim() && num(it.q) > 0).map(it => ({ n: String(it.n).trim(), p: String(it.p ?? '').trim() === '' ? null : num(it.p), q: Math.round(num(it.q)) })); }
/* a price can be left blank and written later, when the bill comes */
function isUnpriced(it) { return it.p == null || String(it.p).trim() === ''; }
function unpricedCount(items) { return (items || []).filter(isUnpriced).length; }
function lineMoney(it) { return isUnpriced(it) ? 'لسه' : money(num(it.p) * it.q); }

/**
 * Split the bill.
 * bill: { tax %, service % (on food), delivery (flat, equal), discount (flat, equal), extras:[{name, amount}] (flat, equal), split: 'prop'|'equal' }
 * proportional: share_i = food_i × (1 + service + tax) + (delivery + extras − discount) / n
 * equal:        share_i = total / n
 * Shares are rounded to 0.01 and the rounding remainder goes to the largest share so the sum equals the total exactly.
 */
function computeBill(orders, bill) {
  const active = (orders || []).filter(o => o.status === 'active');
  const n = active.length;
  const b = bill || {};
  const s = num(b.service) / 100, t = num(b.tax) / 100;
  const extras = (b.extras || []).reduce((a, e) => a + num(e.amount), 0);
  const flat = num(b.delivery) + extras - num(b.discount);
  const food = active.reduce((a, o) => a + itemsTotal(o.items), 0);
  const serviceAmt = food * s, taxAmt = food * t;
  const total = Math.max(0, food + serviceAmt + taxAmt + flat);
  const r2 = x => Math.round(x * 100) / 100;
  const rows = active.map(o => {
    const f = itemsTotal(o.items);
    let share, sv, tx, fl;
    if (b.split === 'equal') { share = n ? total / n : 0; sv = n ? serviceAmt / n : 0; tx = n ? taxAmt / n : 0; fl = n ? flat / n : 0; }
    else { sv = f * s; tx = f * t; fl = n ? flat / n : 0; share = f + sv + tx + fl; }
    return { order: o, food: f, service: sv, tax: tx, flat: fl, share: r2(Math.max(0, share)) };
  });
  const sum = rows.reduce((a, r) => a + r.share, 0);
  const diff = r2(r2(total) - sum);
  if (rows.length && diff !== 0) { const big = rows.reduce((m, r) => (r.share > m.share ? r : m), rows[0]); big.share = r2(big.share + diff); }
  const paid = rows.filter(r => r.order.paid);
  return { food, serviceAmt, taxAmt, extras, flat, total: r2(total), rows, n, paidCount: paid.length, paidAmount: r2(paid.reduce((a, r) => a + r.share, 0)) };
}

/** Group every active item across orders by its (normalised) name — the order you read to the restaurant. */
function aggregate(orders) {
  const map = new Map();
  for (const o of orders.filter(o => o.status === 'active')) for (const it of o.items || []) {
    const key = String(it.n).trim().replace(/\s+/g, ' ').replace(/[أإآ]/g, 'ا').replace(/ة$/, 'ه');
    const cur = map.get(key) || { n: String(it.n).trim(), q: 0, total: 0, unp: 0 };
    cur.q += num(it.q); cur.total += num(it.p) * num(it.q); if (isUnpriced(it)) cur.unp++; map.set(key, cur);
  }
  return [...map.values()].sort((a, b) => b.q - a.q);
}

if (typeof module !== 'undefined') module.exports = { computeBill, aggregate, num, money, egp, toAr, itemsTotal, cleanItems };

/* ===== Storage adapters =====
 * Every adapter exposes the same async API so the UI never knows where data lives:
 *   kind                         'local' | 'artifact' | 'supabase'
 *   getSession(code)             -> session | null
 *   saveSession(session)         full write (create / replace)
 *   patchSession(code, patch)    shallow merge
 *   watch(code, cb)              cb({session, orders}) on every change; returns unsubscribe
 *   saveOrder(code, order)       create / replace one order
 *   deleteOrder(code, id)
 */

/* ---------- Local: this browser only (localStorage + live sync between tabs) ---------- */
function LocalStore() {
  const mem = {};
  const K = code => 'hk_s_' + code;
  const read = code => { try { const v = localStorage.getItem(K(code)); return v ? JSON.parse(v) : (mem[code] || null); } catch { return mem[code] || null; } };
  const write = (code, val) => { mem[code] = val; try { localStorage.setItem(K(code), JSON.stringify(val)); } catch {} ping(code); };
  let bc = null; try { bc = new BroadcastChannel('hesab-kam'); } catch {}
  const subs = new Set();
  function ping(code) { for (const s of subs) if (s.code === code) s.fire(); try { bc && bc.postMessage(code); } catch {} }
  if (bc) bc.onmessage = e => { for (const s of subs) if (s.code === e.data) s.fire(); };
  window.addEventListener('storage', e => { if (e.key && e.key.startsWith('hk_s_')) { const code = e.key.slice(5); for (const s of subs) if (s.code === code) s.fire(); } });
  return {
    kind: 'local',
    async getSession(code) { const v = read(code); return v ? v.session : null; },
    async saveSession(session) { const v = read(session.code) || { orders: {} }; v.session = session; write(session.code, v); },
    async patchSession(code, patch) { const v = read(code); if (!v) return; v.session = { ...v.session, ...patch }; write(code, v); },
    async saveOrder(code, order) { const v = read(code); if (!v) return; v.orders[order.id] = order; write(code, v); },
    async deleteOrder(code, id) { const v = read(code); if (!v) return; delete v.orders[id]; write(code, v); },
    watch(code, cb) {
      const s = { code, fire: () => { const v = read(code); cb({ session: v ? v.session : null, orders: v ? Object.values(v.orders) : [] }); } };
      subs.add(s); setTimeout(s.fire, 0); return () => subs.delete(s);
    }
  };
}

/* ---------- Artifact db: shared between everyone who can open this artifact ---------- */
function ArtifactStore(db) {
  const sdoc = code => db.doc('s/' + code);
  const ocol = code => db.collection('s/' + code + '/o');
  const clone = o => JSON.parse(JSON.stringify(o));
  return {
    kind: 'artifact',
    async getSession(code) { const s = await sdoc(code).get(); return s.exists ? s.data() : null; },
    async saveSession(session) { await sdoc(session.code).set(clone(session)); },
    async patchSession(code, patch) { await sdoc(code).update(clone(patch)); },
    async saveOrder(code, order) { await ocol(code).doc(order.id).set(clone(order)); },
    async deleteOrder(code, id) { await ocol(code).doc(id).delete(); },
    watch(code, cb) {
      let session = null, orders = [], gotS = false, gotO = false;
      const emit = () => { if (gotS && gotO) cb({ session, orders }); };
      const u1 = sdoc(code).onSnapshot(s => { session = s.exists ? s.data() : null; gotS = true; emit(); }, () => {});
      const u2 = ocol(code).onSnapshot(q => { orders = q.docs.map(d => d.data()); gotO = true; emit(); }, () => {});
      return () => { u1(); u2(); };
    }
  };
}

/* ---------- Supabase: the public, deployable version (see supabase/schema.sql) ---------- */
function SupabaseStore(sb) {
  const row = s => ({ code: s.code, data: s });
  return {
    kind: 'supabase',
    async getSession(code) { const { data } = await sb.from('sessions').select('data').eq('code', code).maybeSingle(); return data ? data.data : null; },
    async saveSession(session) { const { error } = await sb.from('sessions').upsert(row(session)); if (error) throw error; },
    async patchSession(code, patch) { const cur = await this.getSession(code); if (!cur) return; const { error } = await sb.from('sessions').update({ data: { ...cur, ...patch } }).eq('code', code); if (error) throw error; },
    async saveOrder(code, order) { const { error } = await sb.from('orders').upsert({ id: order.id, code, data: order }); if (error) throw error; },
    async deleteOrder(code, id) { await sb.from('orders').delete().eq('id', id); },
    watch(code, cb) {
      let alive = true;
      const load = async () => {
        const [{ data: s }, { data: os }] = await Promise.all([
          sb.from('sessions').select('data').eq('code', code).maybeSingle(),
          sb.from('orders').select('data').eq('code', code)
        ]);
        if (alive) cb({ session: s ? s.data : null, orders: (os || []).map(r => r.data) });
      };
      const ch = sb.channel('s-' + code)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sessions', filter: 'code=eq.' + code }, load)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders', filter: 'code=eq.' + code }, load)
        .subscribe();
      load();
      return () => { alive = false; sb.removeChannel(ch); };
    }
  };
}

/* ===== الحساب كام — app (vanilla, one file of screens) ===== */
(function () {
'use strict';
const root = document.getElementById('root');
const CFG = window.HK_CONFIG || {};

/* ---------- device identity & local memory (per browser) ---------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
// "#m1234" opens the session as a separate guest identity in this tab only (to try host + member on one device)
const FORCE_MEMBER = /^#m\d{4}$/.test(location.hash || '');
function ssGet(k) { try { const v = sessionStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } }
const me = (FORCE_MEMBER ? ssGet('hk_me_m') : lsGet('hk_me', null)) || { device: uid(12), name: '', sessions: {} };
const saveMe = () => { if (FORCE_MEMBER) { try { sessionStorage.setItem('hk_me_m', JSON.stringify(me)); } catch {} } else lsSet('hk_me', me); };
saveMe();

/* ---------- storage selection ---------- */
let storeKind = 'pending';
const storeP = (async () => {
  try {
    if (CFG.supabaseUrl && window.supabase) { storeKind = 'supabase'; return SupabaseStore(window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey)); }
    if (window.claude && typeof window.claude.use === 'function') {
      const db = await window.claude.use('db');
      if (db) {
        const user = await window.claude.use('user');
        let ok = true; try { if (user) ok = (await user.can('data.write')) !== false; } catch {}
        if (ok) { storeKind = 'artifact'; return ArtifactStore(db); }
      }
    }
  } catch (e) { console.warn('store fallback', e); }
  storeKind = 'local'; return LocalStore();
})();
storeP.then(() => { if (S.route.name === 'home') render(); });

/* ---------- app state ---------- */
const COLORS = ['#FF5B2E', '#FFD43B', '#12B886', '#17120E', '#8E7CFF', '#FFE4D9', '#4CC3F0', '#F27BB4'];
const darkText = c => ['#FFD43B', '#FFE4D9', '#4CC3F0'].includes(c);
const S = {
  route: { name: 'home', p: {} },
  code: null, session: null, orders: [], unsub: null, loaded: false,
  sheet: null, toast: null,
  draft: {},
  view: { tab: 'person', filter: 'all' }
};
function go(name, p = {}) { S.route = { name, p }; S.sheet = null; render(); window.scrollTo(0, 0); }
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = null; render(); }, 2600); }
function color(i) { return COLORS[i % COLORS.length]; }
function initial(name) { const t = String(name || '؟').trim(); return t ? t[0] : '؟'; }
function avatar(name, i, cls = '') { const c = color(i); return `<span class="avatar ${cls}" style="background:${c};color:${darkText(c) ? '#17120E' : '#fff'}">${esc(initial(name))}</span>`; }
function role() { return S.code && me.sessions[S.code] ? me.sessions[S.code].role : null; }
function myOrder() { const id = S.code && me.sessions[S.code] && me.sessions[S.code].orderId; return S.orders.find(o => o.id === id) || null; }
function orderedOrders() { return [...S.orders].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); }
function orderIndex(o) { return orderedOrders().indexOf(o); }
function remember(code, data) { me.sessions[code] = { ...(me.sessions[code] || {}), ...data, at: Date.now() }; saveMe(); }

/* ---------- live session subscription ---------- */
async function openSession(code) {
  const store = await storeP;
  if (S.unsub && S.code === code) return;
  if (S.unsub) S.unsub();
  S.code = code; S.loaded = false; S.session = null; S.orders = [];
  S.unsub = store.watch(code, ({ session, orders }) => {
    S.session = session; S.orders = orders.filter(o => !o.kind); S.gameRows = orders.filter(o => o.kind === 'game'); S.loaded = true;
    if (!isTyping()) render(); else S.dirty = true;
  });
}
function isTyping() { const a = document.activeElement; return a && root.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && !a.dataset.live; }

const back = (to = 'home') => to === 'reopen' ? `<button class="icon-btn" data-act="reopen" aria-label="رجوع">→</button>` : `<button class="icon-btn" data-go="${to}" aria-label="رجوع">→</button>`;
function persons(n) { return n === 1 ? 'فرد واحد' : n === 2 ? 'فردين' : toAr(n) + ' أفراد'; }
function stepper(id, val, big = false) { return `<div class="stepper ${big ? 'big' : ''}" data-step="${id}"><button type="button" data-d="-1" aria-label="قلل">−</button><output class="num">${toAr(val)}</output><button type="button" class="plus" data-d="1" aria-label="زوّد">+</button></div>`; }
function chips(name, opts, cur) { return `<div class="chips" role="group">${opts.map(([v, l]) => `<button type="button" class="chip" data-chip="${name}" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`; }
function bottom(html) { return `<div class="bottom"><div class="in">${html}</div></div>`; }
function remaining() { if (!S.session || !S.session.deadline) return null; return Math.max(0, S.session.deadline - Date.now()); }
function fmtClock(ms) { const s = Math.ceil(ms / 1000); return toAr(String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0')); }
function timerPill() {
  if (!S.session || S.session.status !== 'open') return '';
  if (!S.session.deadline) return `<span class="pill">بدون وقت</span>`;
  const r = remaining();
  return r > 0 ? `<span class="pill orange">⏱ <span class="timer" data-deadline="${S.session.deadline}">${fmtClock(r)}</span> فاضل</span>` : `<span class="pill red">⏱ الوقت خلص</span>`;
}
setInterval(() => {
  const els = root.querySelectorAll('.timer[data-deadline]');
  let expired = false;
  els.forEach(el => { const r = Math.max(0, +el.dataset.deadline - Date.now()); el.textContent = fmtClock(r); if (r === 0) expired = true; });
  if (expired && !isTyping() && !S.expiredShown) { S.expiredShown = true; render(); }
}, 1000);
function shareUrl(code) { const base = CFG.shareBase || (location.origin + location.pathname); return base.replace(/#.*$/, '') + '#' + code; }
function waLink(text) { return 'https://wa.me/?text=' + encodeURIComponent(text); }
function qrSvg(text) { try { if (!window.qrcode) return ''; const q = window.qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch { return ''; } }
async function copy(text, okMsg = 'اتنسخ ✓') { try { await navigator.clipboard.writeText(text); toast(okMsg); } catch { S.sheet = { type: 'copy', text }; render(); } }

/* ---------- items editor (shared by member, host manual, self mode) ---------- */
function blankItem() { return { n: '', p: '', q: 1 }; }
function itemsEditor(key, items, opts = {}) {
  return `<div class="stack" data-items="${key}">${items.map((it, i) => `

      <span class="cap">اسم الصنف</span><div class="top"><input id="${key}-n-${i}" data-f="n" data-i="${i}" value="${esc(it.n)}" placeholder="${i === 0 ? (opts.ph || 'مثلاً: نص فرخة شيش') : 'صنف تاني'}" autocomplete="off" aria-label="اسم الصنف">
        ${items.length > 1 ? `<button type="button" class="icon-btn sm" data-rm="${i}" aria-label="شيل الصنف">×</button>` : ''}</div>
      <div class="row">
        <div class="fld"><span class="cap">سعره كام؟ (لو عارف)</span><label class="price"><input id="${key}-p-${i}" data-f="p" data-i="${i}" inputmode="decimal" value="${esc(it.p === '' ? '' : toAr(it.p))}" placeholder="مش عارف؟ سيبه" aria-label="سعر الصنف"><span>ج</span></label></div>
        <div class="fld"><span class="cap">العدد</span>${stepper(key + ':' + i, it.q)}</div>

    </div>`).join('')}
    <button type="button" class="dashed" data-additem="${key}">+ ${opts.addLabel || 'ضيف صنف تاني'}</button></div>`;
}
function draftItems(key) { if (!S.draft[key]) S.draft[key] = [blankItem()]; return S.draft[key]; }

V.selfEntry = () => {

  const editing = list[idx];
  const key = 'self-' + idx;
  if (!S.draft[key]) S.draft[key] = editing ? { name: editing.name, items: editing.items.map(x => ({ ...x })) } : { name: idx === 0 ? s.hostName : '', items: [blankItem()] };
  const d = S.draft[key];
  const last = idx + 1 >= total;
  const dots = Array.from({ length: Math.min(total, 12) }, (_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"></i>`).join('');
  const prevOk = S.route.p.ok;
  return `<div class="topbar"><button class="btn sm white" data-act="self-all">كل الطلبات (${toAr(list.length)})</button>${back('home')}</div>
  ${prevOk ? `<div class="card" style="background:var(--mint-soft);border-color:var(--mint-soft);color:var(--mint-ink);font-weight:600">✓ ${esc(prevOk)}</div>` : ''}

  ${bottom(`<div class="cart"><button class="btn ${last ? 'primary' : 'primary'}" data-act="self-next" data-idx="${idx}">${last ? 'خلصنا الحمدلله' : 'اللي بعده'} ←</button><span class="stack" style="gap:0;text-align:right"><span class="big num" style="font-size:24px">${egp(itemsTotal(d.items))}</span><span class="small" style="color:var(--on-ink)">طلب ${esc(d.name || '…')}</span></span></div>

};

/* ---------- Prices: fill in what people ordered without knowing the price ---------- */
function allUnpriced() { return S.orders.filter(o => o.status === 'active').reduce((a, o) => a + unpricedCount(o.items), 0); }
function priceDraft() {
  const d = S.draft.prices || (S.draft.prices = {});
  for (const o of S.orders) if (o.status === 'active' && !d[o.id]) d[o.id] = (o.items || []).map(it => isUnpriced(it) ? '' : it.p);
  return d;
}
function draftLeft() { const d = priceDraft(); let n = 0; for (const o of S.orders) if (o.status === 'active') (d[o.id] || []).forEach(p => { if (String(p ?? '').trim() === '') n++; }); return n; }
V.prices = () => {
  const s = S.session; if (!s) return loading();
  const d = priceDraft(); const list = orderedOrders().filter(o => o.status === 'active');
  const left = draftLeft();
  return `<div class="topbar"><span class="pill ${left ? 'orange' : 'mint'}" id="pr-left">${left ? 'فاضل ' + toAr(left) + ' صنف' : 'كله اتسعّر ✓'}</span>${back('summary')}</div>

  ${list.map(o => { const i = orderIndex(o); const pr = d[o.id] || []; const tot = (o.items || []).reduce((a, it, k) => a + num(pr[k]) * it.q, 0);
    return `<div class="card stack" style="gap:10px">
      <div class="row"><b class="num" id="pr-tot-${o.id}">${egp(tot)}</b><span class="row" style="gap:10px;justify-content:flex-end"><b>${esc(o.name)}</b>${avatar(o.name, i)}</span></div>
      ${(o.items || []).map((it, k) => { const miss = String(pr[k] ?? '').trim() === ''; return `<div class="row"><label class="price" style="${miss ? 'background:#fff;border:1.5px solid var(--orange)' : ''}"><input id="pr-${o.id}-${k}" data-pr="${o.id}" data-k="${k}" inputmode="decimal" value="${esc(miss ? '' : toAr(pr[k]))}" placeholder="السعر" aria-label="سعر ${esc(it.n)}"><span>ج</span></label><span>${it.q > 1 ? toAr(it.q) + ' × ' : ''}${esc(it.n)}</span></div>`; }).join('')}
    </div>`; }).join('')}
  ${bottom(`<button class="btn primary" data-act="prices-save">احفظ الأسعار وكمّل للحساب ←</button>`)}`;
};
root.addEventListener('input', e => {
  const t = e.target; if (!t.dataset.pr) return;

      ${tab === 'person' && filter !== 'paid' && unpaidN ? `<p class="muted small center">«فكّره» بيفتح واتساب برسالة فيها حسابه وطريقة الدفع.</p>` : ''}

/* ---------- Member: join + order + status ---------- */
V.member = () => {
  const s = S.session;
  if (!S.loaded) return loading();
  if (!s) return `<div class="topbar"><span></span>${back('join')}</div><div class="stack" style="align-items:center;text-align:center;gap:10px;padding-top:50px"><span class="emoji">🔍</span><h1>مفيش قعدة بالكود ده</h1><p class="muted">اتأكد من الكود «${codeLabel(S.code)}» أو اطلب اللينك تاني من الهوست.</p></div>${bottom(`<button class="btn dark" data-go="join">جرّب كود تاني</button>`)}`;
  const mine = myOrder();
  const reg = me.sessions[S.code] || {};
  if (reg.role === 'host') return (setTimeout(() => go(s.status === 'open' ? 'live' : s.status === 'billed' ? 'result' : 'summary'), 0), loading());
  if (!mine) {
    if (s.status !== 'open' || (s.deadline && remaining() === 0)) return memberClosed(s);
    if (!reg.name) return memberInvite(s);
    return memberOrder(s);
  }
  if (S.route.p.edit && s.status === 'open' && mine.status !== 'deleted') return memberOrder(s, mine);
  if (s.status === 'billed') return memberBill(s, mine);
  if (mine.status === 'deleted') return memberDeleted(s, mine);
  if (mine.status === 'pending') return memberPending(s, mine);
  if (s.status === 'open') return memberSent(s, mine);
  return memberWaiting(s, mine);
};
function memberHeader(s, extra = '') { return `<div class="topbar">${extra || timerPill() || '<span></span>'}<span class="row" style="gap:8px;justify-content:flex-end"><b class="small">${esc(s.place || 'قعدة')}</b>${avatar(s.hostName, 0)}</span></div>`; }
function memberInvite(s) {
  document.body.className = 'screen-ink';
  const d = S.draft.mname || (S.draft.mname = { name: me.name || '' });
  return `<div class="topbar"><span></span><span class="brand" style="font-size:22px">الحساب كام ${mark(32)}</span></div>
  <div style="color:var(--text)">${inviteCard(s)}</div>
  <label class="f"><span style="color:var(--on-ink)">اسمك ايه؟</span><input class="input" id="m-name" data-bind="mname.name" value="${esc(d.name)}" placeholder="اكتب اسمك" style="color:var(--text)" autocomplete="given-name"></label>
  ${bottom(`<button class="btn primary" data-act="member-name">ادخل واطلب ←</button><p class="center small" style="color:var(--on-ink)">مش محتاج تعمل حساب</p>`)}`;
}
function memberOrder(s, existing) {
  const key = 'mitems';
  if (!S.draft[key]) S.draft[key] = existing ? existing.items.map(x => ({ ...x })) : [blankItem()];
  const items = S.draft[key]; const name = (me.sessions[S.code] || {}).name || me.name;
  return `${memberHeader(s)}
  <div class="stack" style="gap:6px"><h1>اكتب طلبك يا ${esc(name)}</h1><p class="muted">اكتب الصنف، وسعره لو عارفه. لو مش عارف سيبه فاضي، وهيتكتب لما الفاتورة تيجي.${s.menu ? ` <a href="${esc(/^https?:/.test(s.menu) ? s.menu : 'https://' + s.menu)}" target="_blank" rel="noopener" style="color:var(--orange);font-weight:600">افتح المنيو ↗</a>` : ''}</p></div>
  ${itemsEditor(key, items)}
  ${suggestions(key)}
  ${bottom(`<div class="cart"><button class="btn primary" data-act="member-send">${existing ? 'احفظ التعديل' : 'ابعت طلبي'} ←</button><span class="stack" style="gap:0;text-align:right"><span class="big num" style="font-size:24px">${egp(itemsTotal(items))}</span><span class="small" style="color:var(--on-ink)">قبل الخدمة والديليفري</span></span></div>`)}`;
}
function suggestions(key) {
  const seen = new Map();
  for (const o of S.orders) if (o.status === 'active') for (const it of o.items || []) if (!seen.has(it.n) && !isUnpriced(it)) seen.set(it.n, it.p);
  const list = [...seen.entries()].slice(0, 6); if (!list.length) return '';
  return `<div class="stack" style="gap:8px"><span class="muted small">من طلبات الشلة:</span><div class="wrap">${list.map(([n, p]) => `<button type="button" class="pill" style="background:#fff;border:1px solid var(--line);padding:7px 12px" data-suggest="${key}" data-n="${esc(n)}" data-p="${p}">+ ${esc(n)} · ${toAr(money(p))}</button>`).join('')}</div></div>`;
}
function myOrderCard(o, pill) { return `<div class="card stack" style="gap:9px"><div class="row">${pill}<b>طلبك</b></div>${(o.items || []).map(it => `<div class="line"><span class="v num">${lineMoney(it)}</span><span>${toAr(it.q)} × ${esc(it.n)}</span></div>`).join('')}<hr class="rule"><div class="line"><span class="big num" style="font-size:22px">${egp(itemsTotal(o.items))}</span><span class="muted small">قبل الخدمة والديليفري</span></div>${unpricedCount(o.items) ? `<span class="small muted">${toAr(unpricedCount(o.items))} صنف سعره هيتكتب لما الفاتورة تيجي</span>` : ''}</div>`; }
function hero(emoji, title, sub) { return `<div class="stack" style="align-items:center;text-align:center;gap:8px;padding-top:10px"><span class="emoji">${emoji}</span><h1>${title}</h1><p class="muted" style="max-width:320px">${sub}</p></div>`; }
function memberSent(s, o) { return `${memberHeader(s)}${hero('🎉', 'طلبك وصل!', `هتعرف حسابك أول ما ${esc(s.hostName)} يقفل الطلبات ويكتب الفاتورة.`)}${myOrderCard(o, '<span class="pill mint">اتبعت ✓</span>')}${gameEntry()}
  ${bottom(`<button class="btn white" data-act="member-edit">✎ عدّل طلبي</button><p class="center small muted">تقدر تعدّل لحد ما الطلبات تتقفل</p>`)}`; }
function memberDeleted(s, o) { return `${memberHeader(s)}${hero('🫥', `${esc(s.hostName)} شال طلبك`, 'ممكن يكون غلط أو اتكرر. تقدر تبعته تاني وهو يوافق عليه.')}<div style="opacity:.6">${myOrderCard(o, '<span class="pill red">اتشال</span>')}</div>
  ${bottom(s.status === 'open' ? `<button class="btn primary" data-act="member-resend">↻ ابعته تاني</button>` : `<p class="center muted">الطلبات اتقفلت. كلّم ${esc(s.hostName)} لو عايز تتضاف.</p>`)}`; }
function memberPending(s, o) { return `${memberHeader(s)}${hero('✋', `طلبك راح لـ${esc(s.hostName)} تاني`, 'مستنيين يوافق. الصفحة دي هتتحدث لوحدها أول ما يرد.')}${myOrderCard(o, '<span class="pill yellow">مستني الموافقة</span>')}
  ${bottom(`<button class="btn white" data-act="member-cancel">إلغي الطلب</button>`)}`; }
function memberClosed(s) { return `${memberHeader(s, '<span class="pill red">مقفولة</span>')}${hero('🔒', 'القعدة اتقفلت', `${esc(s.hostName)} قفل الطلبات. لو لسه عايز تطلب، كلّمه يزوّد الوقت أو يضيفك بنفسه.`)}
  ${bottom(`<button class="btn white" data-go="join">جرّب كود تاني</button>`)}`; }
function memberWaiting(s, o) { document.body.className = 'screen-ink';
  const step = (t, st) => `<div class="line"><span style="color:${st === 'done' ? 'var(--mint)' : st === 'now' ? 'var(--yellow)' : '#6F655C'}">${st === 'done' ? '✓' : st === 'now' ? '●' : '○'}</span><span style="${st === 'next' ? 'color:#8A8076' : st === 'now' ? 'font-weight:600' : ''}">${t}</span></div>`;
  return `<div class="topbar"><span class="pill white">الطلبات اتقفلت</span><b class="small">${esc(s.place || 'قعدة')}</b></div>${hero('⏳', 'مستنيين الفاتورة…', `أول ما ${esc(s.hostName)} يكتب الضريبة والخدمة والديليفري هيوصلك حسابك بالظبط.`)}
  <div class="card stack" style="background:rgba(255,255,255,.06);border-color:transparent;gap:12px;color:#fff">${step('طلبك اتبعت', 'done')}${step(esc(s.hostName) + ' قفل الطلبات', 'done')}${step(esc(s.hostName) + ' بيكتب الفاتورة', 'now')}${step('حسابك يوصلك', 'next')}</div>${gameEntry()}`; }
function memberBill(s, o) {
  const calc = computeBill(S.orders, s.bill); const r = calc.rows.find(x => x.order.id === o.id);
  if (!r) return memberDeleted(s, o);
  const pay = s.pay || {};
  if (o.paid) { document.body.className = 'screen-mint'; return `<div class="topbar"><span class="pill white">خلصت ✓</span><b class="small">${esc(s.place || '')}</b></div>${hero('✅', `تمام يا ${esc(o.name)}!`, `${esc(s.hostName)} أكد إنه استلم ${egp(r.share)}${o.method === 'cash' ? ' كاش' : o.method === 'instapay' ? ' على إنستاباي' : ''}. شكراً إنك مخلّتهوش يفكّرك 😄`)}<div style="color:var(--text)">${breakdown(r, s)}</div>`; }

  <b>هتدفع إزاي؟</b>

  ${pay.cash ? `<button class="choice" data-claimsel="cash" aria-pressed="${sel === 'cash'}"><span class="row"><span style="font-size:28px">💵</span><span class="stack" style="gap:0;text-align:right"><b>كاش</b><span class="muted small">هتديها لـ${esc(s.hostName)} إيد بإيد</span></span></span></button>` : ''}

}
function loading() { return `<div class="stack" style="align-items:center;padding-top:120px;gap:10px">${mark(40)}<p class="muted">لحظة…</p></div>`; }

/* =====================================================================

function sheetHtml() {
  const sh = S.sheet; if (!sh) return '';
  let body = '';
  if (sh.type === 'order') {
    const key = 'sheet-items'; const items = draftItems(key); const nm = S.draft.sheetName || '';
    body = `<h2>${sh.id ? 'تعديل طلب ' + esc(nm) : 'ضيف طلب لحد'}</h2>${sh.id ? '' : '<p class="muted small">لحد مش معاه نت أو مكسّل يفتح اللينك 😄</p>'}
      <label class="f"><span>اسمه</span><input class="input" id="sheet-name" data-bind="sheetName" value="${esc(nm)}" placeholder="مثلاً: إيفان"></label>
      ${itemsEditor(key, items, { addLabel: 'صنف تاني' })}
      <div class="line"><span class="big num" style="font-size:24px">${egp(itemsTotal(items))}</span><b>الطلب</b></div>

  } else if (sh.type === 'del') {
    const o = S.orders.find(x => x.id === sh.id);
    body = `<div class="stack" style="align-items:center;text-align:center;gap:8px"><span class="icon-btn del" style="width:64px;height:64px;font-size:28px;border:0">🗑</span><h2>تحذف طلب ${esc(o ? o.name : '')}؟</h2><p class="muted small">${o && o.by === 'member' ? 'هيوصله إن طلبه اتشال، ويقدر يطلب تاني وانت توافق.' : 'هيتشال من الحساب.'}</p></div>
      <div class="row" style="gap:10px"><button class="btn white" data-act="sheet-close">لا، سيبه</button><button class="btn red" data-act="del-confirm">أيوه احذف</button></div>`;
  } else if (sh.type === 'pay') {
    const calc = computeBill(S.orders, S.session.bill); const r = calc.rows.find(x => x.order.id === sh.id); const o = r.order; const m = sh.method || o.claim || 'cash';
    body = `<div class="stack" style="align-items:center;text-align:center;gap:6px">${avatar(o.name, orderIndex(o), 'lg')}<p class="muted">${esc(o.name)} دفع</p><div class="big num" style="font-size:44px">${egp(r.share)}</div></div>
      <span class="muted small">دفع إزاي؟</span><div class="row" style="gap:8px"><button class="chip" style="flex:1" data-paym="instapay" aria-pressed="${m === 'instapay'}">💳 إنستاباي</button><button class="chip" style="flex:1" data-paym="cash" aria-pressed="${m === 'cash'}">💵 كاش</button></div>
      <div class="card small" style="background:var(--mint-soft);border-color:var(--mint-soft);color:var(--mint-ink)">لما تأكد، هيتعلّم إنه دفع وهيشوف ده عنده.</div>
      <button class="btn mint" data-act="pay-confirm">أيوه دفع ✓</button>`;
  } else if (sh.type === 'self-all') {
    const list = orderedOrders().filter(o => o.status === 'active'); const food = list.reduce((a, o) => a + itemsTotal(o.items), 0);
    body = `<div class="line"><b class="num">${egp(food)}</b><h2>كل الطلبات لحد دلوقتي</h2></div>
      ${list.length ? list.map((o, i) => `<div class="card row" style="padding:10px 12px"><span class="row" style="gap:6px;justify-content:flex-start"><button class="icon-btn sm del" data-del="${o.id}" aria-label="احذف">🗑</button><button class="icon-btn sm" data-selfedit="${i}" aria-label="عدّل">✎</button></span><span class="row" style="gap:10px;justify-content:flex-end"><span class="stack" style="gap:0;text-align:right"><b>${esc(o.name)} · ${egp(itemsTotal(o.items))}</b><span class="muted small">${esc(o.items.map(x => x.n).join(' · '))}</span></span>${avatar(o.name, i)}</span></div>`).join('') : '<p class="muted center">لسه مفيش طلبات</p>'}
      <button class="btn dark" data-act="sheet-close">كمّل</button>`;
  } else if (sh.type === 'more') {
    const n = sh.n || 1;
    body = `<div class="stack" style="align-items:center;text-align:center;gap:10px"><h2>ناس جت متأخر؟</h2><p class="muted">زوّد العدد وهنكمّل معاهم عادي.</p>${stepper('more', n, true)}<b style="color:var(--orange)">العدد هيبقى ${toAr((S.session.expected || 1) + n)}</b></div><button class="btn dark" data-act="more-confirm">تمام، زوّد</button>`;
  } else if (sh.type === 'end') {
    const n = S.orders.filter(o => o.status === 'active').length;

      <div class="row" style="gap:10px"><button class="btn white" data-act="sheet-close">لسه</button><button class="btn dark" data-act="end-confirm">اقفل</button></div>`;

  }
  return `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div></div>`;
}

/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  const fe = document.activeElement; const fid = fe && root.contains(fe) ? fe.id : null; const sel = fid && fe.selectionStart != null ? [fe.selectionStart, fe.selectionEnd] : null;
  document.body.className = '';
  gameAuto();
  const fn = V[S.route.name] || V.home;
  const wide = ['live', 'result'].includes(S.route.name);
  root.innerHTML = `<main class="app ${wide ? 'wide' : ''}">${fn()}</main>${gameInvite()}${sheetHtml()}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  fitBottom();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { sel && el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  if (S.sheet && S.sheet.type === 'copy') { const t = document.getElementById('copy-box'); if (t) { t.focus(); t.select(); } }
}

// keep the last content clear of the fixed bottom bar, whatever its height
function fitBottom() { const main = root.querySelector('main.app'); const b = root.querySelector('.bottom'); if (main) main.style.paddingBottom = (b ? b.offsetHeight + 24 : 40) + 'px'; }
window.addEventListener('resize', fitBottom);

/* =====================================================================
   EVENTS
   ===================================================================== */
function setPath(path, val) { const parts = path.split('.'); let o = S.draft; for (let i = 0; i < parts.length - 1; i++) { o = o[parts[i]] = o[parts[i]] ?? {}; } o[parts[parts.length - 1]] = val; }
function getPath(path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), S.draft); }
function itemsByKey(key) { return key.includes('.') ? getPath(key) : draftItems(key); }

root.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) {
    const p = t.dataset.bind;
    if (p.startsWith('bill.')) { billDraft()[p.slice(5)] = num(t.value); updateBillTotal(); return; }
    setPath(p, p === 'join.code' ? String(num(t.value) || '').slice(0, 4) : t.value);
    if (p.endsWith('.name') && S.route.name === 'selfEntry') return; return;
  }
  if (t.dataset.extra != null) { const b = billDraft(); const e2 = b.extras[+t.dataset.extra]; if (e2) { e2[t.dataset.f] = t.dataset.f === 'amount' ? num(t.value) : t.value; if (t.dataset.f === 'amount') updateBillTotal(); } return; }
  const box = t.closest('[data-items]');
  if (box && t.dataset.f) { const items = itemsByKey(box.dataset.items); const it = items[+t.dataset.i]; if (!it) return; it[t.dataset.f] = t.dataset.f === 'p' ? (t.value.trim() === '' ? '' : num(t.value)) : t.value; updateTotals(); }
});
function updateBillTotal() { const el = document.getElementById('bill-total'); if (el) el.textContent = egp(computeBill(S.orders, billDraft()).total); }
function updateTotals() { // refresh the running totals without re-rendering inputs
  root.querySelectorAll('.cart .big.num, .sheet .line .big.num').forEach(el => {
    const key = S.sheet && S.sheet.type === 'order' ? 'sheet-items' : S.route.name === 'selfEntry' ? 'self-' + (S.route.p.idx ?? orderedOrders().filter(o => o.status === 'active').length) + '.items' : 'mitems';
    const items = itemsByKey(key); if (items) el.textContent = egp(itemsTotal(items));
  });
}

root.addEventListener('click', async e => {
  const t = e.target.closest('button, a, .overlay'); if (!t) return;
  const d = t.dataset;
  if (t.classList.contains('overlay')) { if (e.target === t) { S.sheet = null; render(); } return; }
  if (d.go) return go(d.go);
  if (d.open) return resume(d.open);
  if (d.copy != null) return copy(d.copy);
  if (d.chip) { setPath(d.chip, isNaN(+d.v) ? d.v : +d.v); return render(); }
  if (d.pickMethod) { S.draft.method = d.pickMethod; return render(); }
  if (d.split) { billDraft().split = d.split; return render(); }
  if (d.tab) { S.view.tab = d.tab; return render(); }
  if (d.filter) { S.view.filter = d.filter; return render(); }
  if (d.claimsel) { S.draft.claim = d.claimsel; return render(); }

    <div class="stack" style="gap:6px"><h1>مين الإمبوستر؟</h1><p class="muted">${my ? 'صوتك اتسجّل. تقدر تغيّره لحد ما الكل يصوّت.' : 'اختار من موبايلك. محدش هيعرف انت صوّت لمين غير في الآخر.'}</p></div>
    <div class="stack" style="gap:8px">${g.players.filter(p => p.device !== me.device).map(p => `<button class="g-vote" data-gv="${esc(p.device)}" aria-pressed="${my === p.device}" style="padding:12px 14px;border-radius:18px">${my === p.device ? '<span class="pill orange">صوتك</span>' : '<span></span>'}<span class="row" style="gap:10px;justify-content:flex-end"><b>${esc(p.name)}</b>${gFace(p.av, p.name, gIdx(g, p.device), '', p.photo)}</span></button>`).join('')}</div>
    <div class="wrap" aria-label="مين صوّت">${g.players.map(p => { const v = c.votes.find(x => x.from === p.device); return `<span class="pill ${v && v.to ? 'mint' : ''}">${v && v.to ? '✓ ' : ''}${esc(p.name)}</span>`; }).join('')}</div>
    <details class="g-box" style="padding:12px 14px"><summary class="small" style="cursor:pointer;color:var(--on-ink)">افتكر كارتك</summary><div style="margin-top:10px">${g.imp === me.device ? '<b>انت الإمبوستر</b>' : `الأكلة: <b>${esc(g.dish)}</b>`}</div></details>
    ${starter && c.nVoted > 0 ? bottom(`<button class="btn white" data-game="closevotes">اقفل التصويت دلوقتي</button>`) : ''}`;
  }
  const breakdown = `<div class="g-box stack" style="gap:8px"><span class="small muted">مين صوّت لمين</span>${c.votes.map(v => `<div style="display:flex;gap:6px;align-items:center"><b>${esc(gName(g, v.from))}</b><span class="muted small">صوّت لـ</span><b style="color:${v.to === g.imp ? 'var(--mint)' : 'var(--orange)'}">${v.to ? esc(gName(g, v.to)) : '—'}</b></div>`).join('')}</div>`;
  if (c.phase === 'guess') {
    const imp = g.imp === me.device;
    return `${gTop(g, roundPill)}
    <div class="g-result" style="background:var(--mint)"><span class="small">اتمسك!</span><h2>${esc(gName(g, g.imp))} كان الإمبوستر</h2><span>بس ليه فرصة أخيرة: لو عرف الأكلة يكسب هو</span></div>
    ${imp ? `<h2 style="font-size:24px">الأكلة كانت إيه؟</h2><div class="g-grid">${g.options.map(d => `<button class="g-dish" data-gg="${esc(d)}">${esc(d)}</button>`).join('')}</div>`
          : `<p class="center muted">مستنيين ${esc(gName(g, g.imp))} يخمّن الأكلة…</p>${breakdown}`}`;
  }
  // over
  const sc = gScores(g, c);
  const board = g.players.map(p => ({ ...p, s: sc[p.device] || 0 })).sort((a, b) => b.s - a.s);
  const title = c.winner === 'group' ? 'الشلة كسبت!' : 'الإمبوستر كسب!';
  const impName = esc(gName(g, g.imp));
  const sub = c.reason === 'caught' ? `${impName} اتمسك ومعرفش الأكلة (قال ${esc(c.guess)})`
    : c.reason === 'guessed' ? `${impName} اتمسك، بس عرف الأكلة!`
    : c.reason === 'tie' ? `الأصوات اتعادلت، و${impName} هرب`
    : `اتهمتوا ${esc(gName(g, c.accused))}، والإمبوستر كان ${impName}`;
  return `${gTop(g, roundPill)}
  <div class="g-result" style="background:${c.winner === 'group' ? 'var(--mint)' : 'var(--orange)'}"><h1>${title}</h1><span>${sub}</span><span class="pill" style="background:rgba(0,0,0,.22);color:#fff;margin-top:6px">الأكلة كانت: ${esc(g.dish)}</span></div>
  <div class="g-box stack" style="gap:6px"><span class="small muted">النقط</span>${board.map((b, k) => `<div class="line" style="align-items:center"><span class="big" style="font-size:22px;color:${k === 0 && b.s > 0 ? 'var(--yellow)' : '#fff'}">${toAr(b.s)}</span><span class="row" style="gap:10px;justify-content:flex-end"><b>${esc(b.name)}${b.device === me.device ? ' (انت)' : ''}</b>${gFace(b.av, b.name, gIdx(g, b.device), 'sm', b.photo)}</span></div>`).join('')}</div>
  ${breakdown}
  <p class="mode-note" style="color:var(--on-ink)">الشلة تكسب: نقطة لكل واحد · الإمبوستر يكسب: ٣ نقط</p>
  ${bottom(starter ? `<button class="btn primary" data-game="again">جولة جديدة ←</button><button class="btn white" data-game="stop">كفاية كده</button>`
                   : `<p class="center small" style="color:var(--on-ink)">مستنيين ${esc(g.byName)} يبدأ جولة جديدة</p><button class="btn white" data-game="leave">ارجع للقعدة</button>`)}`;
};

/* ---------- actions ---------- */
root.addEventListener('click', e => {
  const t = e.target.closest('[data-game],[data-gv],[data-gg]'); if (!t) return;
  e.stopPropagation();
  const g = gGame(); const d = t.dataset;
  if (d.gv) { if (!g) return; return withStore(() => gSaveRow(g, { vote: d.gv })); }
  if (d.gg) { if (!g || g.imp !== me.device) return; t.disabled = true; return withStore(() => gSaveRow(g, { guess: d.gg })); }
  switch (d.game) {
    case 'ans': return; // the form's submit sends it
    case 'open': return go('game');
    case 'leave': S.route = { name: 'home', p: {} }; return resume(S.code);
    case 'peek': S.gShown = !S.gShown; return render();
    case 'decline': S.gDismiss = g && g.id; return render();
    case 'look': S.gpNext = null; S.gpBack = S.route; S.gpDraft = null; return go('gprofile');
    case 'new': return gNeedProfile(() => withStore(async st => {
      if (gGame()) return go('game');
      const type = d.gtype || 'impostor'; const old = S.session.game; const same = old && (old.type || 'impostor') === type;
      const ng = { id: uid(8), type, by: me.device, byName: gPlayerName(), byAv: gProfile() && gProfile().av, byPhoto: gProfile() && gProfile().av === 'photo' ? gProfile().photo : null, status: 'lobby', createdAt: Date.now(), scores: same && old.scores || {}, round: same && old.round || 0 };
      await st.patchSession(S.code, { game: ng }); S.session.game = ng; await gSaveRow(ng, { join: true }); go('game');
    }));
    case 'join': return gNeedProfile(() => withStore(async () => { await gSaveRow(g, { join: true }); go('game'); }));
    case 'late': return gNeedProfile(() => withStore(async () => { await gSaveRow(g, { join: true }); render(); }));
    case 'unjoin': return withStore(async () => { await gSaveRow(g, { join: false }); S.gDismiss = g.id; S.route = { name: 'home', p: {} }; resume(S.code); });
    case 'start': return withStore(async st => {
      const players = gRows(g).filter(r => r.join).map(r => ({ device: r.device, name: r.name, av: r.av || null, photo: r.photo || null }));
      const min = g.type === 'emoji' ? 2 : G_MIN;
      if (players.length < min) return toast('محتاجين ' + toAr(min) + ' لاعيبة على الأقل');
      const nr = g.type === 'emoji' ? eNewRound(players, g.scores || {}, (g.round || 0) + 1) : gNewRound(players, g.scores || {}, (g.round || 0) + 1);
      await st.patchSession(S.code, { game: { ...nr, type: g.type || 'impostor', by: g.by, byName: g.byName, byAv: g.byAv, byPhoto: g.byPhoto || null } });
    });
    case 'votenow': return withStore(st => st.patchSession(S.code, { game: { ...g, voteNow: true } }));
    case 'closevotes': return withStore(st => st.patchSession(S.code, { game: { ...g, closeVotes: true } }));
    case 'again': return withStore(async st => {
      const c = gCalc(g); const scores = g.type === 'emoji' ? eScores(g, c) : gScores(g, c);
      const late = gRows(g).filter(r => r.join && !g.players.some(p => p.device === r.device)).map(r => ({ device: r.device, name: r.name, av: r.av || null, photo: r.photo || null }));
      const all = [...g.players, ...late];
      const nr = g.type === 'emoji' ? eNewRound(all, scores, (g.round || 1) + 1) : gNewRound(all, scores, (g.round || 1) + 1);
      await st.patchSession(S.code, { game: { ...nr, type: g.type || 'impostor', by: g.by, byName: g.byName, byAv: g.byAv, byPhoto: g.byPhoto || null } });
    });
    case 'stop': return withStore(async st => { await st.patchSession(S.code, { game: { ...g, status: 'off' } }); S.route = { name: 'home', p: {} }; resume(S.code); });
  }
}, true);

/* the clock, and phases that change with time alone (talk → vote) */
setInterval(() => {
  if (S.route.name !== 'game') return;
  const g = gGame(); if (!g || g.status !== 'play') return;
  const el = document.getElementById('g-clock');
  if (el && g.type === 'emoji') { const c = eCalc(g); if (c.cur) el.textContent = toAr(Math.max(0, Math.ceil((c.cur.end - Date.now()) / 1000))); }
  else if (el) el.textContent = fmtClock(Math.max(0, (g.talkEnds || 0) - Date.now()));
  if (S.gPhase !== g.id + gCalc(g).phase && !isTyping()) render();
}, 1000);

/* ---------- boot ---------- */
function boot() {
  const m = (location.hash || '').match(/^#?m?(\d{4})$/);
  if (m) { const c = m[1]; if (!me.sessions[c]) remember(c, { role: 'member' }); resume(c); }
  else render();
}
window.addEventListener('hashchange', boot);
boot();
})();
</script>
<script>
/* ===== Light / dark: a real rope you grab and pull ===== */
(function () {
  'use strict';
  const html = document.documentElement;
  const KEY = 'hk_theme';
  const meta = document.querySelector('meta[name="theme-color"]');
  const reduce = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const cur = () => html.dataset.theme === 'dark' ? 'dark' : 'light';

  /* ---------- markup ---------- */
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('class', 'rope'); svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(NS, 'path');
  const ball = document.createElementNS(NS, 'circle'); ball.setAttribute('r', '6.5');
  svg.append(path, ball);
  const grab = document.createElement('button'); grab.type = 'button'; grab.className = 'rope-grab';
  document.body.append(svg, grab);

  function apply(t, save) {
    html.dataset.theme = t;
    if (meta) meta.setAttribute('content', t === 'dark' ? '#15110E' : '#FF5B2E');
    grab.setAttribute('aria-pressed', String(t === 'dark'));
    grab.setAttribute('aria-label', t === 'dark' ? 'اشد الحبل للوضع النهاري' : 'اشد الحبل للوضع الليلي');
    if (save) { try { localStorage.setItem(KEY, t); } catch (e) {} }
  }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(cur(), false);
  if (!saved && window.matchMedia) {
    try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (!busy) apply(e.matches ? 'dark' : 'light', false); }); } catch (e) {}
  }

  /* ---------- rope physics (verlet) ---------- */
  const N = 16, REST = 84, G = 0.42, DAMP = 0.988, ITER = 22, FIRE = 70;
  let L = REST / N, ax = 0, ay = -4;
  const pts = [];
  function anchorX() { return Math.round(Math.max(16, innerWidth / 2 - 240) + 26); } // far left of the column
  ax = anchorX();
  for (let i = 0; i <= N; i++) { const y = ay + i * L; pts.push({ x: ax, y, px: ax, py: y }); }
  const end = pts[N];

  let dragging = false, finger = null, downAt = null, moved = false, busy = false, lastNudge = 0;

  addEventListener('resize', () => { const nx = anchorX(), dx = nx - ax; ax = nx; for (const p of pts) { p.x += dx; p.px += dx; } });

  function step(now) {
    // gentle breeze so it never hangs dead still
    if (!dragging && now - lastNudge > 2600) { lastNudge = now; end.px += (Math.random() < .5 ? -1 : 1) * (0.6 + Math.random() * 0.9); }
    // the rope stretches with your finger, and springs back to its length when you let go
    const target = dragging && finger ? Math.max(REST, Math.hypot(finger.x - ax, finger.y - ay) * 1.02) / N : REST / N;
    L += (target - L) * (dragging ? 0.6 : 0.22);
    for (let i = 1; i <= N; i++) {
      const p = pts[i];
      const vx = (p.x - p.px) * DAMP, vy = (p.y - p.py) * DAMP;
      p.px = p.x; p.py = p.y; p.x += vx; p.y += vy + G;
    }
    for (let k = 0; k < ITER; k++) {
      pts[0].x = ax; pts[0].y = ay;
      if (dragging && finger) { end.x = finger.x; end.y = finger.y; }
      for (let i = 0; i < N; i++) {
        const a = pts[i], b = pts[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1e-4;
        const diff = (d - L) / d;
        const aFixed = i === 0, bFixed = dragging && i + 1 === N;
        if (aFixed && bFixed) continue;
        if (aFixed) { b.x -= dx * diff; b.y -= dy * diff; }
        else if (bFixed) { a.x += dx * diff; a.y += dy * diff; }
        else { a.x += dx * diff * .5; a.y += dy * diff * .5; b.x -= dx * diff * .5; b.y -= dy * diff * .5; }
      }
    }
    // draw a smooth curve through the points
    let d = `M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 1; i < N; i++) { const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2; d += ` Q${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`; }
    d += ` L${end.x.toFixed(1)} ${end.y.toFixed(1)}`;
    path.setAttribute('d', d);
    ball.setAttribute('cx', end.x.toFixed(1)); ball.setAttribute('cy', end.y.toFixed(1));
    grab.style.transform = `translate(${end.x}px,${end.y}px)`;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  /* ---------- grabbing ---------- */
  const clampFinger = (x, y) => ({ x: Math.max(12, Math.min(innerWidth - 12, x)), y: Math.max(ay + 8, Math.min(innerHeight * 0.55, y)) });
  grab.addEventListener('pointerdown', e => {
    e.preventDefault();
    dragging = true; moved = false; downAt = { x: e.clientX, y: e.clientY, bx: end.x, by: end.y };
    finger = clampFinger(end.x, end.y);
    try { grab.setPointerCapture(e.pointerId); } catch (_) {}
  });
  grab.addEventListener('pointermove', e => {
    if (!dragging) return;
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) moved = true;
    finger = clampFinger(downAt.bx + (e.clientX - downAt.x), downAt.by + (e.clientY - downAt.y));
  });
  function release(cancel) {
    if (!dragging) return;
    const stretch = Math.hypot(end.x - ax, end.y - ay) - REST;
    dragging = false; finger = null;
    if (cancel) return;
    if (!moved) tug();
    else if (stretch >= FIRE) toggle();
  }
  grab.addEventListener('pointerup', () => release(false));
  grab.addEventListener('pointercancel', () => release(true));
  grab.addEventListener('click', e => { if (e.detail === 0) tug(); }); // keyboard
  // a tap = a quick tug: stretch it down and let it fly back up
  function tug() { for (let i = 1; i <= N; i++) pts[i].y += (i / N) * 70; L = (REST + 70) / N; toggle(); }

  /* ---------- the sky between themes ---------- */
  function toggle() {
    if (busy) return;
    const next = cur() === 'dark' ? 'light' : 'dark';
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    if (reduce() || !document.body.animate) { apply(next, true); return; }
    busy = true;
    const toLight = next === 'light';
    const sky = document.createElement('div'); sky.className = 'sky';
    sky.innerHTML = '<div class="blur"></div><div class="tint dusk"></div><div class="tint dawn"></div><span class="orb moon"></span><span class="orb sun"></span>';
    document.body.appendChild(sky);
    const $ = s => sky.querySelector(s);
    const W = innerWidth, H = innerHeight, D = 1900;
    const at = (fx, fy) => `translate(${Math.round(W * fx)}px,${Math.round(H * fy)}px)`;
    const run = (el, frames, delay, dur, easing) => el.animate(frames, { duration: dur, delay, easing: easing || 'cubic-bezier(.45,0,.3,1)', fill: 'both' });
    run($('.blur'), [{ opacity: 0 }, { opacity: 1, offset: .3 }, { opacity: 1, offset: .65 }, { opacity: 0 }], 0, D, 'linear');
    const first = toLight ? $('.dusk') : $('.dawn'), second = toLight ? $('.dawn') : $('.dusk');
    run(first, [{ opacity: 0 }, { opacity: 1, offset: .45 }, { opacity: 1, offset: .6 }, { opacity: 0 }], 0, D * .62, 'linear');
    run(second, [{ opacity: 0 }, { opacity: 1, offset: .35 }, { opacity: 1, offset: .55 }, { opacity: 0 }], D * .4, D * .6, 'linear');
    const moonTop = [.30, .34], moonLow = [.04, 1.05], sunTop = [.78, .42], sunLow = [.94, 1.08];
    if (toLight) {
      run($('.moon'), [{ transform: at(...moonTop), opacity: 0 }, { opacity: 1, offset: .15 }, { transform: at(...moonLow), opacity: 1 }], 0, D * .58);
      run($('.sun'), [{ transform: at(...sunLow), opacity: 1 }, { transform: at(...sunTop), opacity: 1, offset: .8 }, { transform: at(...sunTop), opacity: 0 }], D * .38, D * .62, 'cubic-bezier(.2,.8,.3,1)');
    } else {
      run($('.sun'), [{ transform: at(...sunTop), opacity: 0 }, { opacity: 1, offset: .15 }, { transform: at(...sunLow), opacity: 1 }], 0, D * .58);
      run($('.moon'), [{ transform: at(...moonLow), opacity: 1 }, { transform: at(...moonTop), opacity: 1, offset: .8 }, { transform: at(...moonTop), opacity: 0 }], D * .38, D * .62, 'cubic-bezier(.2,.8,.3,1)');
    }
    setTimeout(() => apply(next, true), D * .48);
    setTimeout(() => { sky.remove(); busy = false; }, D + 60);
  }
})();
</script>
